# Configuração do broker montada pelo compose.yaml.
# As filas do projeto são transitórias (durable=False) e não exclusivas.
# Esta opção permite esse recurso descontinuado na versão RabbitMQ escolhida;
# não transforma as filas em duráveis nem garante recuperação após falhas.

# Permite declarar filas transitórias não exclusivas, usadas pelos seis consumidores.
deprecated_features.permit.transient_nonexcl_queues = true
